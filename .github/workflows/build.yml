name: Build

# Every push/PR builds and tests the plugin and uploads the zip as a workflow
# artifact. Pushing a tag like v0.4.0 also publishes a GitHub Release with
# the zip attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 enables caching automatically when package.json has a
          # "packageManager" field, which needs pnpm on PATH before corepack
          # has installed it. The build is quick, so skip the cache.
          package-manager-cache: false

      # Uses the pnpm version pinned in package.json ("packageManager").
      - run: corepack enable

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      # Builds the frontend, runs the Python tests and writes out/a1x-rgb.zip.
      - run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: a1x-rgb
          path: out/a1x-rgb.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: a1x-rgb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" a1x-rgb.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
